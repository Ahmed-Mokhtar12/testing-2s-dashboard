# The six blocks below vendor the deployed verify_jwt state for functions that
# had no repo source until 2026-07-31 (see supabase/functions/<slug>/index.ts
# header comments). All six now require a JWT: firecrawl-scrape,
# browserless-scrape and export-booking-inquiries were locked down first, then
# serpapi-hotels; sheraton-marriott-browser and instagram-token-service were
# already verify_jwt = true in production and were not touched.
#
# NOTE: these six were the *unaccounted-for* public functions. As of 2026-09-01 the only
# function that is still verify_jwt = false BY CONTRACT is whatsapp-control-status: two live
# n8n workflows call it with no headers and onError=continue (backlog B17). whatsapp-web-chat
# and execute-n8n-action are staff-gated (getUser + is_hotel_staff); whatsapp-auto-release
# accepts service_role JWTs only. None of them ever "carried its own in-body auth" before
# 2026-09-01 — that earlier claim here was wrong (audit E1/E2/E5/E12).

[functions.firecrawl-scrape]
verify_jwt = true

[functions.browserless-scrape]
verify_jwt = true

[functions.serpapi-hotels]
verify_jwt = true

[functions.export-booking-inquiries]
verify_jwt = true

[functions.sheraton-marriott-browser]
verify_jwt = true

[functions.instagram-token-service]
verify_jwt = true
