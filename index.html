<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Production mirror of the Content-Security-Policy HTTP header that
         public/serve.json emits on testing (production nginx serves dist/
         directly, so this meta is production's only CSP — backlog B12).
         frame-ancestors is deliberately absent here: browsers ignore it in
         <meta>, so it lives in the header only. The two copies are pinned to
         each other by tests/unit/csp-header-meta-agree.test.ts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com data:;
               connect-src 'self' https://*.supabase.co wss://*.supabase.co https://login.microsoftonline.com;
               img-src 'self' data: blob: https://*.supabase.co https://2s-dashboard.digitlab.ai;
               media-src 'self' blob: https://*.supabase.co;
               worker-src 'self' blob:;
               object-src 'none';
               base-uri 'self';
               form-action 'self';"
    />
    <title>Two Seasons Insights</title>
    <meta name="description" content="Real-time insights dashboard for Two Seasons Hotel" />
    <meta name="author" content="Two Seasons" />

    <meta property="og:title" content="Two Seasons Insights" />
    <meta property="og:description" content="Real-time insights dashboard for Two Seasons Hotel" />
    <meta property="og:image" content="https://2s-dashboard.digitlab.ai/og-image.png" />
    <meta property="og:url" content="https://2s-dashboard.digitlab.ai" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Two Seasons Insights" />
    <meta name="twitter:image" content="https://2s-dashboard.digitlab.ai/og-image.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
